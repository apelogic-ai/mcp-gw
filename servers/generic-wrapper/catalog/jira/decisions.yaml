schemaVersion: mcp-gateway.generic-tool-decisions/v1
catalogId: atlassian-rovo-v2-live
tools:
  - name: addOrEditJiraIssueComment
    disposition: include
    alias: add_comment
    actionClass: write
    operation: jira.issue.comment.upsert
    scopes: [write:jira:agent-interface]
  - name: addOrEditJiraIssueWorklog
    disposition: include
    alias: add_worklog
    actionClass: write
    operation: jira.issue.worklog.upsert
    scopes: [write:jira:agent-interface]
  - name: convertJiraIssueHierarchy
    disposition: include
    alias: convert_issue_hierarchy
    actionClass: write
    operation: jira.issue.hierarchy.convert
    scopes: [write:jira:agent-interface]
  - name: createJiraBoard
    disposition: include
    alias: create_board
    actionClass: write
    operation: jira.board.create
    scopes: [write:jira:agent-interface]
  - name: createJiraIssue
    disposition: include
    alias: create_issue
    actionClass: write
    operation: jira.issue.create
    scopes: [write:jira:agent-interface]
  - name: createJiraIssueLink
