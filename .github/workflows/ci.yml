name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run ci

      - name: Run deployment validation
        run: bun run deploy:check

      - name: Verify existing Helm manifest compatibility
        if: github.event_name == 'pull_request'
        run: bun run helm:compat:check
        env:
          HELM_COMPAT_BASE_REF: origin/${{ github.base_ref }}

      - name: Run release metadata validation
        run: bun run release:check

  local-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Resolve pinned AgentGateway source
        id: agentgateway-source
        run: bun scripts/resolve-agentgateway-source.ts --github-output "$GITHUB_OUTPUT"

      - name: Check out pinned AgentGateway source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ steps.agentgateway-source.outputs.repository }}
          ref: ${{ steps.agentgateway-source.outputs.ref }}
          path: .build/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned AgentGateway candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .build/agentgateway
          load: true
          tags: mcp-gw-agentgateway:ci
          build-args: |
            VERSION=ci
            GIT_REVISION=${{ steps.agentgateway-source.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ steps.agentgateway-source.outputs.source_url }}
            org.opencontainers.image.revision=${{ steps.agentgateway-source.outputs.ref }}
            org.opencontainers.image.version=ci
          cache-from: type=gha,scope=agentgateway-ci
          cache-to: type=gha,mode=max,scope=agentgateway-ci

      - name: Build generic wrapper candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: servers/generic-wrapper/Dockerfile
          load: true
          tags: mcp-gw-generic-wrapper:ci
          cache-from: type=gha,scope=generic-wrapper-ci
          cache-to: type=gha,mode=max,scope=generic-wrapper-ci

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run generic wrapper reference-server integration
        run: bun run integration:generic
        env:
          GENERIC_WRAPPER_IMAGE: mcp-gw-generic-wrapper:ci

      - name: Run Linux broker integration smoke
        run: bun run integration:local
        env:
          LOCAL_INCLUDE_GITHUB: "1"
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:ci

      - name: Run Linux broker-disabled external issuer integration smoke
        run: bun run integration:external
        env:
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:ci
