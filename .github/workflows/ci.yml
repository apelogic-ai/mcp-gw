name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run ci

      - name: Run deployment validation
        run: bun run deploy:check

      - name: Run release metadata validation
        run: bun run release:check

  kubernetes-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out pinned agentgateway source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: apelogic-ai/agentgateway
          ref: 360a5dfd2f088ddb91d8f506f329934fe8b92c43
          path: .build/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned agentgateway candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .build/agentgateway
          load: true
          tags: mcp-gw-agentgateway:smoke
          build-args: |
            VERSION=smoke
            GIT_REVISION=360a5dfd2f088ddb91d8f506f329934fe8b92c43
          cache-from: type=gha,scope=agentgateway-smoke
          cache-to: type=gha,mode=max,scope=agentgateway-smoke

      - name: Build Google Workspace wrapper candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: servers/google-workspace/wrapper/Dockerfile
          load: true
          tags: mcp-gw-google-workspace:smoke
          cache-from: type=gha,scope=google-workspace-smoke
          cache-to: type=gha,mode=max,scope=google-workspace-smoke

      - name: Build GitHub wrapper candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: servers/github-mcp/wrapper/Dockerfile
          load: true
          tags: mcp-gw-github-wrapper:smoke
          cache-from: type=gha,scope=github-wrapper-smoke
          cache-to: type=gha,mode=max,scope=github-wrapper-smoke

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local MCP integration smoke against candidate
        run: bun run integration:local
        env:
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:smoke

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: mcp-gateway-smoke

      - name: Load agentgateway candidate into Kubernetes
        run: kind load docker-image mcp-gw-agentgateway:smoke --name mcp-gateway-smoke

      - name: Load provider candidates into Kubernetes
        run: |
          docker pull ghcr.io/github/github-mcp-server:v1.6.0
          kind load docker-image mcp-gw-google-workspace:smoke --name mcp-gateway-smoke
          kind load docker-image mcp-gw-github-wrapper:smoke --name mcp-gateway-smoke
          kind load docker-image ghcr.io/github/github-mcp-server:v1.6.0 --name mcp-gateway-smoke

      - name: Run Kubernetes smoke
        run: bun run integration:k8s
        env:
          K8S_SMOKE_AGENTGATEWAY_REPOSITORY: mcp-gw-agentgateway
          K8S_SMOKE_AGENTGATEWAY_TAG: smoke

      - name: Run provider runtime Kubernetes smoke
        run: bash scripts/smoke-k8s-provider-runtime.sh

      - name: Run full provider bundle integration smoke
        run: bun run integration:bundle
        env:
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:smoke

  arm64-inputs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - name: Check out pull request history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq \
            '^(\.github/workflows/(ci|release)\.yml|package\.json|bun\.lock|tsconfig\.json|src/|shared/|servers/)'; then
            printf 'required=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'required=false\n' >> "$GITHUB_OUTPUT"
          fi

  arm64-image-build:
    needs: arm64-inputs
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' || needs.arm64-inputs.outputs.required == 'true')
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agentgateway
            context: .build/agentgateway
            dockerfile: .build/agentgateway/Dockerfile
          - component: google-workspace
            context: .
            dockerfile: servers/google-workspace/wrapper/Dockerfile
          - component: github-wrapper
            context: .
            dockerfile: servers/github-mcp/wrapper/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out pinned agentgateway source
        if: matrix.component == 'agentgateway'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: apelogic-ai/agentgateway
          ref: 360a5dfd2f088ddb91d8f506f329934fe8b92c43
          path: .build/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build ${{ matrix.component }} for arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          tags: mcp-gw-${{ matrix.component }}:arm64-smoke
          build-args: |
            VERSION=smoke
            GIT_REVISION=360a5dfd2f088ddb91d8f506f329934fe8b92c43
          cache-from: type=gha,scope=arm64-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.component }}
