name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run ci

      - name: Run deployment validation
        run: bun run deploy:check

      - name: Run local MCP integration smoke
        run: bun run integration:local

      - name: Run release metadata validation
        run: bun run release:check

  kubernetes-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out pinned agentgateway source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: apelogic-ai/agentgateway
          ref: cb2fffdafe3d5e31216c82e9d16641c5f6a47cb8
          path: .build/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned agentgateway candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .build/agentgateway
          load: true
          tags: mcp-gw-agentgateway:smoke
          build-args: |
            VERSION=smoke
            GIT_REVISION=cb2fffdafe3d5e31216c82e9d16641c5f6a47cb8
          cache-from: type=gha,scope=agentgateway-smoke
          cache-to: type=gha,mode=max,scope=agentgateway-smoke

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: mcp-gateway-smoke

      - name: Load agentgateway candidate into Kubernetes
        run: kind load docker-image mcp-gw-agentgateway:smoke --name mcp-gateway-smoke

      - name: Run Kubernetes smoke
        run: bun run integration:k8s
        env:
          K8S_SMOKE_AGENTGATEWAY_REPOSITORY: mcp-gw-agentgateway
          K8S_SMOKE_AGENTGATEWAY_TAG: smoke

  publish-images:
    needs: [validate, kubernetes-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agentgateway
            repository: mcp-gw-agentgateway
            context: .release/agentgateway
            dockerfile: .release/agentgateway/Dockerfile
          - component: google-workspace
            repository: mcp-gw-google-workspace
            context: .
            dockerfile: servers/google-workspace/wrapper/Dockerfile
          - component: github-wrapper
            repository: mcp-gw-github-wrapper
            context: .
            dockerfile: servers/github-mcp/wrapper/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out pinned agentgateway source
        if: matrix.component == 'agentgateway'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: apelogic-ai/agentgateway
          ref: cb2fffdafe3d5e31216c82e9d16641c5f6a47cb8
          path: .release/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record image digest
        run: |
          mkdir -p dist
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'dist/${{ matrix.component }}.digest'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          format: json
          output: dist/${{ matrix.component }}.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload image release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}
          path: dist/*
          if-no-files-found: error

  publish-chart:
    needs: [validate, kubernetes-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Log in to GHCR for Helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Log in to GHCR for provenance
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish OCI chart
        id: chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package deploy/k8s/chart --destination dist --version "$VERSION" --app-version "$VERSION"
          mkdir -p "$RUNNER_TEMP/chart-scan"
          tar -xzf "dist/mcp-gateway-$VERSION.tgz" -C "$RUNNER_TEMP/chart-scan"
          PUSH_OUTPUT="$(helm push "dist/mcp-gateway-$VERSION.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/charts')"
          printf '%s\n' "$PUSH_OUTPUT"
          DIGEST="$(printf '%s\n' "$PUSH_OUTPUT" | awk '$1 == "Digest:" {print $2}')"
          test -n "$DIGEST"
          printf '%s\n' "$DIGEST" > dist/helm-chart.digest
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ runner.temp }}/chart-scan
          format: spdx-json
          output-file: dist/helm-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate chart vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: json
          output: dist/helm-chart.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/mcp-gateway
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Upload chart release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart
          path: dist/*
          if-no-files-found: error

  promote-ecr:
    needs: [publish-images, publish-chart]
    if: ${{ vars.ECR_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      MCP_GW_ECR_IMAGE_REPOSITORY: ${{ vars.MCP_GW_ECR_IMAGE_REPOSITORY }}
      MCP_GW_ECR_CHART_REPOSITORY: ${{ vars.MCP_GW_ECR_CHART_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up ORAS
        uses: oras-project/setup-oras@4fb5323ce5e4debde6f8fe277e461b0815a75992
        with:
          version: 1.3.3

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Install Cosign
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017
        with:
          cosign-release: v3.1.2

      - name: Download approved release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve private registry coordinates
        id: coordinates
        env:
          AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          : "${AWS_RELEASE_ROLE_ARN:?Set the AWS_RELEASE_ROLE_ARN repository variable}"
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${ECR_REGISTRY:?Set the ECR_REGISTRY repository variable}"
          : "${MCP_GW_ECR_IMAGE_REPOSITORY:?Set MCP_GW_ECR_IMAGE_REPOSITORY}"
          : "${MCP_GW_ECR_CHART_REPOSITORY:?Set MCP_GW_ECR_CHART_REPOSITORY}"

          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_IMAGE_DIGEST="$(cat dist/agentgateway.digest)"
          SOURCE_CHART_DIGEST="$(cat dist/helm-chart.digest)"
          IMAGE_REPOSITORY="$ECR_REGISTRY/$MCP_GW_ECR_IMAGE_REPOSITORY"
          CHART_REPOSITORY="$ECR_REGISTRY/$MCP_GW_ECR_CHART_REPOSITORY"

          {
            printf 'version=%s\n' "$VERSION"
            printf 'source-image-digest=%s\n' "$SOURCE_IMAGE_DIGEST"
            printf 'source-chart-digest=%s\n' "$SOURCE_CHART_DIGEST"
            printf 'image-repository=%s\n' "$IMAGE_REPOSITORY"
            printf 'chart-repository=%s\n' "$CHART_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mcp-gw-release-${{ github.run_id }}

      - name: Authenticate registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          aws ecr get-login-password --region "$AWS_REGION" \
            | oras login "$ECR_REGISTRY" --username AWS --password-stdin

      - name: Promote exact approved manifests
        id: promote
        env:
          VERSION: ${{ steps.coordinates.outputs.version }}
          SOURCE_IMAGE_DIGEST: ${{ steps.coordinates.outputs['source-image-digest'] }}
          SOURCE_CHART_DIGEST: ${{ steps.coordinates.outputs['source-chart-digest'] }}
          IMAGE_REPOSITORY: ${{ steps.coordinates.outputs['image-repository'] }}
          CHART_REPOSITORY: ${{ steps.coordinates.outputs['chart-repository'] }}
        run: |
          SOURCE_IMAGE="ghcr.io/$GITHUB_REPOSITORY_OWNER/mcp-gw-agentgateway@$SOURCE_IMAGE_DIGEST"
          SOURCE_CHART="ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/mcp-gateway@$SOURCE_CHART_DIGEST"
          TARGET_IMAGE="$IMAGE_REPOSITORY:$VERSION"
          TARGET_CHART="$CHART_REPOSITORY:$VERSION"

          oras cp "$SOURCE_IMAGE" "$TARGET_IMAGE"
          oras cp "$SOURCE_CHART" "$TARGET_CHART"

          IMAGE_DIGEST="$(oras manifest fetch --descriptor "$TARGET_IMAGE" | jq -r '.digest')"
          CHART_DIGEST="$(oras manifest fetch --descriptor "$TARGET_CHART" | jq -r '.digest')"
          test "$IMAGE_DIGEST" = "$SOURCE_IMAGE_DIGEST"
          test "$CHART_DIGEST" = "$SOURCE_CHART_DIGEST"

          printf '%s\n' "$IMAGE_DIGEST" > dist/ecr-agentgateway.digest
          printf '%s\n' "$CHART_DIGEST" > dist/ecr-helm-chart.digest
          printf 'image-digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'chart-digest=%s\n' "$CHART_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign promoted artifacts
        env:
          IMAGE_REPOSITORY: ${{ steps.coordinates.outputs['image-repository'] }}
          CHART_REPOSITORY: ${{ steps.coordinates.outputs['chart-repository'] }}
          IMAGE_DIGEST: ${{ steps.promote.outputs['image-digest'] }}
          CHART_DIGEST: ${{ steps.promote.outputs['chart-digest'] }}
        run: |
          cosign sign --yes \
            --output-signature dist/ecr-agentgateway.sig \
            --output-certificate dist/ecr-agentgateway.pem \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          cosign sign --yes \
            --output-signature dist/ecr-helm-chart.sig \
            --output-certificate dist/ecr-helm-chart.pem \
            "$CHART_REPOSITORY@$CHART_DIGEST"

      - name: Attest promoted image provenance
        id: ecr-image-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.coordinates.outputs['image-repository'] }}
          subject-digest: ${{ steps.promote.outputs['image-digest'] }}
          push-to-registry: true

      - name: Attest promoted chart provenance
        id: ecr-chart-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.coordinates.outputs['chart-repository'] }}
          subject-digest: ${{ steps.promote.outputs['chart-digest'] }}
          push-to-registry: true

      - name: Preserve private registry evidence
        run: |
          cp '${{ steps.ecr-image-provenance.outputs['bundle-path'] }}' dist/ecr-agentgateway.provenance.json
          cp '${{ steps.ecr-chart-provenance.outputs['bundle-path'] }}' dist/ecr-helm-chart.provenance.json

      - name: Generate private registry handoff
        env:
          VERSION: ${{ steps.coordinates.outputs.version }}
          IMAGE_REPOSITORY: ${{ steps.coordinates.outputs['image-repository'] }}
          CHART_REPOSITORY: ${{ steps.coordinates.outputs['chart-repository'] }}
        run: |
          bun scripts/generate-private-release-handoff.ts \
            --version "$VERSION" \
            --release-commit "$GITHUB_SHA" \
            --image-repository "$IMAGE_REPOSITORY" \
            --chart-repository "$CHART_REPOSITORY" \
            --artifacts dist \
            --output dist/ecr-release-handoff.md

      - name: Upload private registry handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ecr-release-handoff
          path: |
            dist/ecr-*
            dist/agentgateway.spdx.json
            dist/agentgateway.vulnerabilities.json
            dist/helm-chart.spdx.json
            dist/helm-chart.vulnerabilities.json
          if-no-files-found: error

  release:
    needs: [publish-images, publish-chart, promote-ecr]
    if: >-
      ${{
        always() &&
        needs.publish-images.result == 'success' &&
        needs.publish-chart.result == 'success' &&
        (needs.promote-ecr.result == 'success' || needs.promote-ecr.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Download release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release handoff
        run: |
          bun scripts/generate-release-handoff.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --artifacts dist \
            --output dist/release-handoff.md

      - name: Verify public artifact access
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-agentgateway@$(cat dist/agentgateway.digest)"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-google-workspace@$(cat dist/google-workspace.digest)"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-github-wrapper@$(cat dist/github-wrapper.digest)"
          helm pull "oci://ghcr.io/$OWNER/charts/mcp-gateway" \
            --version "${GITHUB_REF_NAME#v}" \
            --destination /tmp

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file dist/release-handoff.md
