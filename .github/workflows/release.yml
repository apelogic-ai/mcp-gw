name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run ci

      - name: Run deployment validation
        run: bun run deploy:check

      - name: Run local MCP integration smoke
        run: bun run integration:local

      - name: Run release metadata validation
        run: bun run release:check

  kubernetes-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out pinned agentgateway source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: apelogic-ai/agentgateway
          ref: 551c9c608c67df85e1ca60d8c611badf5e069681
          path: .build/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned agentgateway candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .build/agentgateway
          load: true
          tags: mcp-gw-agentgateway:smoke
          build-args: |
            VERSION=smoke
            GIT_REVISION=551c9c608c67df85e1ca60d8c611badf5e069681
          cache-from: type=gha,scope=agentgateway-smoke
          cache-to: type=gha,mode=max,scope=agentgateway-smoke

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: mcp-gateway-smoke

      - name: Load agentgateway candidate into Kubernetes
        run: kind load docker-image mcp-gw-agentgateway:smoke --name mcp-gateway-smoke

      - name: Run Kubernetes smoke
        run: bun run integration:k8s
        env:
          K8S_SMOKE_AGENTGATEWAY_REPOSITORY: mcp-gw-agentgateway
          K8S_SMOKE_AGENTGATEWAY_TAG: smoke

  publish-images:
    needs: [validate, kubernetes-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agentgateway
            repository: mcp-gw-agentgateway
            context: .release/agentgateway
            dockerfile: .release/agentgateway/Dockerfile
          - component: google-workspace
            repository: mcp-gw-google-workspace
            context: .
            dockerfile: servers/google-workspace/wrapper/Dockerfile
          - component: github-wrapper
            repository: mcp-gw-github-wrapper
            context: .
            dockerfile: servers/github-mcp/wrapper/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check out pinned agentgateway source
        if: matrix.component == 'agentgateway'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: apelogic-ai/agentgateway
          ref: 551c9c608c67df85e1ca60d8c611badf5e069681
          path: .release/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Record image digest
        run: |
          mkdir -p dist
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'dist/${{ matrix.component }}.digest'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          format: json
          output: dist/${{ matrix.component }}.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload image release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}
          path: dist/*
          if-no-files-found: error

  publish-chart:
    needs: [validate, kubernetes-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Package and publish OCI chart
        id: chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package deploy/k8s/chart --destination dist --version "$VERSION" --app-version "$VERSION"
          PUSH_OUTPUT="$(helm push "dist/mcp-gateway-$VERSION.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/charts')"
          printf '%s\n' "$PUSH_OUTPUT"
          DIGEST="$(printf '%s\n' "$PUSH_OUTPUT" | awk '$1 == "Digest:" {print $2}')"
          test -n "$DIGEST"
          printf '%s\n' "$DIGEST" > dist/helm-chart.digest
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/mcp-gateway
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Upload chart release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart
          path: dist/*
          if-no-files-found: error

  release:
    needs: [publish-images, publish-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Download release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release handoff
        run: |
          bun scripts/generate-release-handoff.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --artifacts dist \
            --output dist/release-handoff.md

      - name: Verify public artifact access
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-agentgateway@$(cat dist/agentgateway.digest)"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-google-workspace@$(cat dist/google-workspace.digest)"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-github-wrapper@$(cat dist/github-wrapper.digest)"
          helm pull "oci://ghcr.io/$OWNER/charts/mcp-gateway" \
            --version "${GITHUB_REF_NAME#v}" \
            --destination /tmp

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file dist/release-handoff.md
