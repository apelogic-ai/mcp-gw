name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: bun run ci

      - name: Run deployment validation
        run: bun run deploy:check

      - name: Run release metadata validation
        run: bun run release:check

  kubernetes-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Resolve pinned AgentGateway source
        id: agentgateway-source
        run: bun scripts/resolve-agentgateway-source.ts --github-output "$GITHUB_OUTPUT"

      - name: Resolve pinned GitHub MCP Server source
        id: github-mcp-source
        run: bun scripts/resolve-github-mcp-source.ts --github-output "$GITHUB_OUTPUT"

      - name: Check out pinned AgentGateway source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ steps.agentgateway-source.outputs.repository }}
          ref: ${{ steps.agentgateway-source.outputs.ref }}
          path: .build/agentgateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build pinned agentgateway candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .build/agentgateway
          load: true
          tags: mcp-gw-agentgateway:smoke
          build-args: |
            VERSION=smoke
            GIT_REVISION=${{ steps.agentgateway-source.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ steps.agentgateway-source.outputs.source_url }}
            org.opencontainers.image.revision=${{ steps.agentgateway-source.outputs.ref }}
            org.opencontainers.image.version=smoke
          cache-from: type=gha,scope=agentgateway-smoke
          cache-to: type=gha,mode=max,scope=agentgateway-smoke

      - name: Build Google Workspace wrapper candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: servers/google-workspace/wrapper/Dockerfile
          load: true
          tags: mcp-gw-google-workspace:smoke
          cache-from: type=gha,scope=google-workspace-smoke
          cache-to: type=gha,mode=max,scope=google-workspace-smoke

      - name: Build GitHub wrapper candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: servers/github-mcp/wrapper/Dockerfile
          load: true
          tags: mcp-gw-github-wrapper:smoke
          cache-from: type=gha,scope=github-wrapper-smoke
          cache-to: type=gha,mode=max,scope=github-wrapper-smoke

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local MCP integration smoke against candidate
        run: bun run integration:local
        env:
          LOCAL_INCLUDE_GITHUB: "1"
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:smoke

      - name: Run broker-disabled external issuer integration smoke against candidate
        run: bun run integration:external
        env:
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:smoke

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: mcp-gateway-smoke

      - name: Load agentgateway candidate into Kubernetes
        run: kind load docker-image mcp-gw-agentgateway:smoke --name mcp-gateway-smoke

      - name: Load provider candidates into Kubernetes
        run: |
          GITHUB_MCP_SOURCE="${{ steps.github-mcp-source.outputs.source_coordinate }}"
          GITHUB_MCP_TAGGED="${{ steps.github-mcp-source.outputs.source_repository }}:${{ steps.github-mcp-source.outputs.source_tag }}"
          docker pull "$GITHUB_MCP_SOURCE"
          docker tag "$GITHUB_MCP_SOURCE" "$GITHUB_MCP_TAGGED"
          kind load docker-image mcp-gw-google-workspace:smoke --name mcp-gateway-smoke
          kind load docker-image mcp-gw-github-wrapper:smoke --name mcp-gateway-smoke
          kind load docker-image "$GITHUB_MCP_TAGGED" --name mcp-gateway-smoke

      - name: Run Kubernetes smoke
        run: bun run integration:k8s
        env:
          K8S_SMOKE_AGENTGATEWAY_REPOSITORY: mcp-gw-agentgateway
          K8S_SMOKE_AGENTGATEWAY_TAG: smoke

      - name: Run provider runtime Kubernetes smoke
        run: bash scripts/smoke-k8s-provider-runtime.sh

      - name: Run full provider bundle integration smoke against candidate
        run: bun run integration:bundle
        env:
          LOCAL_AGENTGATEWAY_IMAGE: mcp-gw-agentgateway:smoke

  mirror-github-mcp-server:
    needs: [validate, kubernetes-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Resolve pinned GitHub MCP Server source
        id: github-mcp-source
        run: bun scripts/resolve-github-mcp-source.ts --github-output "$GITHUB_OUTPUT"

      - name: Set up Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: v2.6.0

      - name: Set up ORAS
        uses: oras-project/setup-oras@4fb5323ce5e4debde6f8fe277e461b0815a75992
        with:
          version: 1.3.3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror the reviewed third-party image by digest
        env:
          MIRROR_REPOSITORY: ${{ steps.github-mcp-source.outputs.mirror_repository }}
          SOURCE_COORDINATE: ${{ steps.github-mcp-source.outputs.source_coordinate }}
          SOURCE_DIGEST: ${{ steps.github-mcp-source.outputs.source_digest }}
          SOURCE_REPOSITORY: ${{ steps.github-mcp-source.outputs.source_repository }}
          SOURCE_TAG: ${{ steps.github-mcp-source.outputs.source_tag }}
        run: |
          set -euo pipefail
          TARGET="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${MIRROR_REPOSITORY}"
          test "$(oras resolve "$SOURCE_REPOSITORY:$SOURCE_TAG")" = "$SOURCE_DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/github/github-mcp-server/.github/workflows/docker-publish.yml@refs/tags/$SOURCE_TAG" \
            "$SOURCE_COORDINATE"
          oras cp --recursive "$SOURCE_COORDINATE" "$TARGET:$SOURCE_TAG"
          MIRROR_DIGEST="$(oras resolve "$TARGET:$SOURCE_TAG")"
          test "$MIRROR_DIGEST" = "$SOURCE_DIGEST"
          mkdir -p dist
          printf '%s\n' "$MIRROR_DIGEST" > dist/github-mcp-server.digest

      - name: Upload mirror release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-github-mcp-server
          path: dist/github-mcp-server.digest
          if-no-files-found: error

  build-platform-images:
    needs: [validate, kubernetes-smoke]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agentgateway
            repository: mcp-gw-agentgateway
            context: .release/agentgateway
            dockerfile: .release/agentgateway/Dockerfile
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - component: agentgateway
            repository: mcp-gw-agentgateway
            context: .release/agentgateway
            dockerfile: .release/agentgateway/Dockerfile
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: google-workspace
            repository: mcp-gw-google-workspace
            context: .
            dockerfile: servers/google-workspace/wrapper/Dockerfile
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - component: google-workspace
            repository: mcp-gw-google-workspace
            context: .
            dockerfile: servers/google-workspace/wrapper/Dockerfile
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: github-wrapper
            repository: mcp-gw-github-wrapper
            context: .
            dockerfile: servers/github-mcp/wrapper/Dockerfile
            architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - component: github-wrapper
            repository: mcp-gw-github-wrapper
            context: .
            dockerfile: servers/github-mcp/wrapper/Dockerfile
            architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Resolve pinned AgentGateway source
        id: agentgateway-source
        run: bun scripts/resolve-agentgateway-source.ts --github-output "$GITHUB_OUTPUT"

      - name: Check out pinned AgentGateway source
        if: matrix.component == 'agentgateway'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ steps.agentgateway-source.outputs.repository }}
          ref: ${{ steps.agentgateway-source.outputs.ref }}
          path: .release/agentgateway

      - name: Select image source metadata
        shell: bash
        run: |
          if [[ '${{ matrix.component }}' == 'agentgateway' ]]; then
            printf 'BUILD_SOURCE_URL=%s\n' '${{ steps.agentgateway-source.outputs.source_url }}' >> "$GITHUB_ENV"
            printf 'BUILD_GIT_REVISION=%s\n' '${{ steps.agentgateway-source.outputs.ref }}' >> "$GITHUB_ENV"
          else
            printf 'BUILD_SOURCE_URL=https://github.com/%s\n' "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
            printf 'BUILD_GIT_REVISION=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.architecture }} image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_REVISION=${{ env.BUILD_GIT_REVISION }}
          labels: |
            org.opencontainers.image.source=${{ env.BUILD_SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.BUILD_GIT_REVISION }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}-${{ matrix.architecture }}

      - name: Record ${{ matrix.architecture }} image digest
        run: |
          mkdir -p dist
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'dist/${{ matrix.component }}-${{ matrix.architecture }}-arch-index.digest'

      - name: Upload platform digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-digest-${{ matrix.component }}-${{ matrix.architecture }}
          path: dist/${{ matrix.component }}-${{ matrix.architecture }}-arch-index.digest
          if-no-files-found: error

  publish-images:
    needs: build-platform-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agentgateway
            repository: mcp-gw-agentgateway
          - component: google-workspace
            repository: mcp-gw-google-workspace
          - component: github-wrapper
            repository: mcp-gw-github-wrapper
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: platform-digest-${{ matrix.component }}-*
          path: dist
          merge-multiple: true

      - name: Assemble immutable multi-platform manifest
        id: merge
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.repository }}"
          AMD64_DIGEST="$(cat "dist/${{ matrix.component }}-amd64-arch-index.digest")"
          ARM64_DIGEST="$(cat "dist/${{ matrix.component }}-arm64-arch-index.digest")"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"
          DIGEST="sha256:$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | sha256sum | awk '{print $1}')"
          printf '%s\n' "$DIGEST" > "dist/${{ matrix.component }}.digest"
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.merge.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.merge.outputs.digest }}
          format: json
          output: dist/${{ matrix.component }}.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Enforce zero critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}@${{ steps.merge.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Upload image release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}
          path: dist/*
          if-no-files-found: error

  released-kubernetes-broker-smoke:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Resolve pinned GitHub MCP Server source
        id: github-mcp-source
        run: bun scripts/resolve-github-mcp-source.ts --github-output "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Create Kubernetes cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: mcp-gateway-broker-release-smoke

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load published release images into Kubernetes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          AGENTGATEWAY_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-agentgateway:$VERSION"
          GOOGLE_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-google-workspace:$VERSION"
          GITHUB_WRAPPER_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-github-wrapper:$VERSION"
          GITHUB_MCP_SOURCE="${{ steps.github-mcp-source.outputs.source_coordinate }}"
          GITHUB_MCP_IMAGE="${{ steps.github-mcp-source.outputs.source_repository }}:${{ steps.github-mcp-source.outputs.source_tag }}"
          POSTGRES_IMAGE="postgres:16-alpine"

          docker pull "$AGENTGATEWAY_IMAGE"
          docker pull "$GOOGLE_IMAGE"
          docker pull "$GITHUB_WRAPPER_IMAGE"
          docker pull "$GITHUB_MCP_SOURCE"
          docker tag "$GITHUB_MCP_SOURCE" "$GITHUB_MCP_IMAGE"
          docker pull "$POSTGRES_IMAGE"
          kind load docker-image \
            "$AGENTGATEWAY_IMAGE" \
            "$GOOGLE_IMAGE" \
            "$GITHUB_WRAPPER_IMAGE" \
            "$GITHUB_MCP_IMAGE" \
            "$POSTGRES_IMAGE" \
            --name mcp-gateway-broker-release-smoke

      - name: Test broker-authenticated Kubernetes fanout
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export K8S_BROKER_SMOKE_AGENTGATEWAY_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-agentgateway"
          export K8S_BROKER_SMOKE_GOOGLE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-google-workspace"
          export K8S_BROKER_SMOKE_GITHUB_WRAPPER_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-github-wrapper"
          export K8S_BROKER_SMOKE_IMAGE_TAG="$VERSION"
          bun run integration:k8s:broker

  released-full-bundle-smoke:
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test cached catalog through OAuth and disconnect against published images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export LOCAL_AGENTGATEWAY_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-agentgateway:$VERSION"
          export LOCAL_GOOGLE_WORKSPACE_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-google-workspace:$VERSION"
          export LOCAL_GITHUB_WRAPPER_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mcp-gw-github-wrapper:$VERSION"
          bun run integration:bundle
        env:
          FULL_BUNDLE_USE_PREBUILT_IMAGES: "1"

  publish-chart:
    needs:
      [
        validate,
        kubernetes-smoke,
        mirror-github-mcp-server,
        publish-images,
        released-kubernetes-broker-smoke,
        released-full-bundle-smoke,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Set up ORAS
        uses: oras-project/setup-oras@4fb5323ce5e4debde6f8fe277e461b0815a75992
        with:
          version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download published image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Log in to GHCR for Helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Log in to GHCR for provenance
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin Artifact Hub images to published digests
        run: |
          bun scripts/set-artifacthub-images.ts \
            --chart deploy/k8s/chart/Chart.yaml \
            --agentgateway-digest "$(cat dist/agentgateway.digest)" \
            --google-workspace-digest "$(cat dist/google-workspace.digest)" \
            --github-wrapper-digest "$(cat dist/github-wrapper.digest)" \
            --github-mcp-server-digest "$(cat dist/github-mcp-server.digest)"

      - name: Package and publish OCI chart
        id: chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          helm package deploy/k8s/chart --destination dist --version "$VERSION" --app-version "$VERSION"
          mkdir -p "$RUNNER_TEMP/chart-scan"
          tar -xzf "dist/mcp-gateway-$VERSION.tgz" -C "$RUNNER_TEMP/chart-scan"
          PUSH_OUTPUT="$(helm push "dist/mcp-gateway-$VERSION.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/charts')"
          printf '%s\n' "$PUSH_OUTPUT"
          DIGEST="$(printf '%s\n' "$PUSH_OUTPUT" | awk '$1 == "Digest:" {print $2}')"
          test -n "$DIGEST"
          printf '%s\n' "$DIGEST" > dist/helm-chart.digest
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish Artifact Hub repository metadata
        env:
          METADATA_FILE: deploy/k8s/chart/artifacthub-repo.yml
          METADATA_REF: oci://ghcr.io/${{ github.repository_owner }}/charts/mcp-gateway
        run: |
          test -f "$METADATA_FILE"
          oras push "${METADATA_REF#oci://}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "$METADATA_FILE:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ runner.temp }}/chart-scan
          format: spdx-json
          output-file: dist/helm-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate chart vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: json
          output: dist/helm-chart.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Enforce zero critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/mcp-gateway
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Upload chart release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart
          path: dist/*
          if-no-files-found: error

  release:
    needs: [publish-images, publish-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Download release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release handoff
        run: |
          bun scripts/generate-release-handoff.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --artifacts dist \
            --output dist/release-handoff.md

      - name: Verify public artifact access
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          GITHUB_MCP_MIRROR="ghcr.io/$OWNER/mcp-gw-github-mcp-server"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-agentgateway@$(cat dist/agentgateway.digest)"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-google-workspace@$(cat dist/google-workspace.digest)"
          docker buildx imagetools inspect "ghcr.io/$OWNER/mcp-gw-github-wrapper@$(cat dist/github-wrapper.digest)"
          docker buildx imagetools inspect "$GITHUB_MCP_MIRROR@$(cat dist/github-mcp-server.digest)"
          helm pull "oci://ghcr.io/$OWNER/charts/mcp-gateway" \
            --version "${GITHUB_REF_NAME#v}" \
            --destination /tmp

      - name: Verify public release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          SIGNER="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/public-attestations"
          gh attestation verify \
            "oci://ghcr.io/$OWNER/mcp-gw-agentgateway@$(cat dist/agentgateway.digest)" \
            --repo "$GITHUB_REPOSITORY" --cert-identity "$SIGNER" \
            --format json > "$RUNNER_TEMP/public-attestations/agentgateway.json"
          gh attestation verify \
            "oci://ghcr.io/$OWNER/mcp-gw-google-workspace@$(cat dist/google-workspace.digest)" \
            --repo "$GITHUB_REPOSITORY" --cert-identity "$SIGNER" \
            --format json > "$RUNNER_TEMP/public-attestations/google-workspace.json"
          gh attestation verify \
            "oci://ghcr.io/$OWNER/mcp-gw-github-wrapper@$(cat dist/github-wrapper.digest)" \
            --repo "$GITHUB_REPOSITORY" --cert-identity "$SIGNER" \
            --format json > "$RUNNER_TEMP/public-attestations/github-wrapper.json"
          gh attestation verify \
            "oci://ghcr.io/$OWNER/charts/mcp-gateway@$(cat dist/helm-chart.digest)" \
            --repo "$GITHUB_REPOSITORY" --cert-identity "$SIGNER" \
            --format json > "$RUNNER_TEMP/public-attestations/helm-chart.json"
          bun scripts/check-public-release-evidence.ts \
            --artifacts dist \
            --subject "ghcr.io/$OWNER/mcp-gw-agentgateway" \
            --subject "ghcr.io/$OWNER/mcp-gw-google-workspace" \
            --subject "ghcr.io/$OWNER/mcp-gw-github-wrapper" \
            --subject "ghcr.io/$OWNER/charts/mcp-gateway" \
            --attestation "$RUNNER_TEMP/public-attestations/agentgateway.json" \
            --attestation "$RUNNER_TEMP/public-attestations/google-workspace.json" \
            --attestation "$RUNNER_TEMP/public-attestations/github-wrapper.json" \
            --attestation "$RUNNER_TEMP/public-attestations/helm-chart.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --notes-file dist/release-handoff.md
