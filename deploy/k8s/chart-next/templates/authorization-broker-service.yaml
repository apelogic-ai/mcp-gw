{{- if include "mcp-gateway.brokerEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-gateway.brokerServiceName" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: authorization-broker
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-gateway.selectorLabels" (dict "root" . "component" "google-workspace") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.googleWorkspace.port }}
      targetPort: http
{{- end }}
