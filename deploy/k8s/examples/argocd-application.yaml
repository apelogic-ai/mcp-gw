# EXAMPLE - Argo CD consumes the public OCI chart and values from a private config repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-gateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/apelogic-ai/charts
      chart: mcp-gateway
      targetRevision: 0.2.6
      helm:
        valueFiles:
          - $values/environments/production/mcp-gateway-values.yaml
    - repoURL: https://github.com/example/enterprise-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
