# EXAMPLE - Flux consumption from an organization's private config repository.
# Reconcile the referenced ConfigMap or Secret from private GitOps content.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-gateway
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/apelogic-ai/charts/mcp-gateway
  ref:
    tag: 0.2.1
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: mcp-gateway
    namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  valuesFrom:
    - kind: ConfigMap
      name: mcp-gateway-values
      valuesKey: values.yaml
