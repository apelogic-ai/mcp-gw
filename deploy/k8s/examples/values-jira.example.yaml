# Opt-in Jira Cloud provider. Create the existing Secret named below before
# installation; the chart does not create or own provider credentials.
hop1:
  issuers:
    - name: workforce
      issuer: https://identity.example.com
      audiences:
        - https://mcp.example.com/mcp
      jwksUrl: https://identity.example.com/.well-known/jwks.json
      allowedAlgorithms:
        - EdDSA
      emailClaim: email
      subjectClaim: sub

agentgateway:
  enabled: true
  image:
    repository: ghcr.io/apelogic-ai/mcp-gw-agentgateway
    tag: ""
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  mcpAuthentication:
    resourceMetadata:
      resource: https://mcp.example.com/mcp
  backends: []

connectionLifecycle:
  enabled: true
  allowedCallers:
    # Select the Gateway data-plane Pods that deliver the exact callback route.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: public-gateway

oauthMigrations:
  enabled: true
  image:
    repository: ghcr.io/apelogic-ai/mcp-gw-generic-wrapper
    tag: ""
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  secretKeyRef:
    name: jira-oauth-runtime
    key: TOKEN_STORE_DSN

wrappers:
  - name: jira
    enabled: true
    image:
      repository: ghcr.io/apelogic-ai/mcp-gw-generic-wrapper
      tag: ""
      digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    toolPrefix: jira
    lifecycleRoutes: true
    upstream:
      transport: http
      url: https://mcp.atlassian.com/v2/mcp?tools=all
      timeoutMs: 30000
    credential:
      mode: per_user_oauth
      providerId: jira
      authorizationUrl: https://auth.atlassian.com/authorize
      tokenUrl: https://auth.atlassian.com/oauth/token
      userInfoUrl: https://api.atlassian.com/oauth/token/accessible-resources
      redirectUri: https://mcp.example.com/oauth/jira/callback
      scopes:
        - read:jira-user
        - read:jira-work
        - read:jira:agent-interface
        - search:jira:agent-interface
        - offline_access
      clientIdEnv: JIRA_OAUTH_CLIENT_ID
      clientSecretEnv: JIRA_OAUTH_CLIENT_SECRET
      encryptionKeyEnv: JIRA_TOKEN_ENCRYPTION_KEY
      tokenStoreDsnEnv: TOKEN_STORE_DSN
      identity:
        mode: atlassian_jira_asserted_email
        siteUrl: https://example.atlassian.net
      authorizationParams:
        audience: api.atlassian.com
        prompt: consent
      tokenEndpointAuthMethod: client_secret_post
      timeoutMs: 10000
    secretRef:
      name: jira-oauth-runtime
      envKeys:
        - JIRA_OAUTH_CLIENT_ID
        - JIRA_OAUTH_CLIENT_SECRET
        - JIRA_TOKEN_ENCRYPTION_KEY
        - TOKEN_STORE_DSN
    serverInfo:
      name: jira-wrapper
      version: "0.7.0"
    # The wrapper filters live Jira discovery through its reviewed decisions and
    # keeps only read/search tools. Use `jira` and add
    # write:jira:agent-interface only when approved tool authority is enforced
    # end to end.
    catalog:
      preset: jira-read-only
    policy:
      yaml: |
        default: deny
        rules:
          - id: allow-read-only
            effect: allow
            match:
              actionClass: read
