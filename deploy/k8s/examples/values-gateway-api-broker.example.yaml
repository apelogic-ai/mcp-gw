# Optional overlay for values-oauth-broker.example.yaml when /mcp and provider
# callback paths already have an operator-owned Gateway API HTTPRoute. The chart
# creates only the broker's exact public HTTPRoute, never another /mcp route.
# Replace the Gateway reference and BOTH NetworkPolicy selectors with the
# actual environment's Gateway and data-plane proxy Pod labels before use.
agentgateway:
  ingress:
    enabled: false
  gatewayApi:
    brokerHttpRoute:
      enabled: true
      parentRefs:
        - name: public-gateway
          namespace: gateway-system
          sectionName: https

googleWorkspace:
  authorizationBroker:
    ingressControllerPeer:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway-proxy # illustrative; inspect data-plane Pods
    ingressSourceCidrs: []
    dcr:
      enabled: true
