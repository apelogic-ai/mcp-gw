# Optional overlay for values-oauth-broker.example.yaml when /mcp and provider
# callback paths already have an operator-owned Gateway API HTTPRoute. The chart
# creates only the broker's exact public HTTPRoute, never another /mcp route.
# Replace the Gateway reference and BOTH NetworkPolicy selectors with the
# actual environment's Gateway and Envoy data-plane pod labels before use.
agentgateway:
  ingress:
    enabled: false
  gatewayApi:
    brokerHttpRoute:
      enabled: true
      parentRefs:
        - name: shared
          namespace: envoy-gateway-system
          sectionName: https

googleWorkspace:
  authorizationBroker:
    ingressControllerPeer:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: envoy # illustrative; inspect data-plane pods
    ingressSourceCidrs: []
    dcr:
      enabled: true
