hop1:
  issuers:
    - name: unavailable-fixture
      issuer: https://unavailable.example.com
      audiences:
        - https://mcp.example.com/mcp
      jwksUrl: http://127.0.0.1:9/.well-known/jwks.json
      allowedAlgorithms:
        - EdDSA
      discoverable: true
      emailClaim: email
      subjectClaim: sub

agentgateway:
  enabled: true
  backends:
    # The smoke exercises authentication before backend dispatch. Keep one
    # deliberately unavailable target so the production no-empty-target
    # invariant is covered without adding an unrelated workload.
    - name: unavailable-fixture
      enabled: true
      host: http://unavailable-backend.invalid:8080/mcp
  mcpAuthentication:
    resourceMetadata:
      resource: https://mcp.example.com/mcp
      scopesSupported:
        - openid
        - email
      bearerMethodsSupported:
        - header
