# Opt-in full provider bundle fixture. The deployment overlay must replace the
# fixture issuer and existing Secret references with environment-owned values.
productionProfile:
  enabled: true

hop1:
  issuers:
    - name: fixture-identity
      issuer: https://identity.example.com
      audiences:
        - https://mcp.example.com/mcp
      jwksUrl: https://identity.example.com/.well-known/jwks.json
      allowedAlgorithms:
        - EdDSA
      discoverable: true
      emailClaim: email
      subjectClaim: sub

oauthMigrations:
  enabled: true
  secretKeyRef:
    name: mcp-oauth-database
    key: dsn
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

agentgateway:
  enabled: true
  mcpAuthentication:
    resourceMetadata:
      resource: https://mcp.example.com/mcp
      scopesSupported:
        - openid
        - email
      bearerMethodsSupported:
        - header
  backends:
    - name: google-workspace
      enabled: true
      serviceName: google-workspace
      port: 8080
      path: /mcp
    - name: github-mcp
      enabled: true
      serviceName: github-wrapper
      port: 8080
      path: /mcp
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

googleWorkspace:
  enabled: true
  secretRef:
    name: mcp-provider-runtime
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

githubWrapper:
  enabled: true
  secretRef:
    name: mcp-provider-runtime
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

githubMcp:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
