# Provider-neutral GitOps profile for an existing shared Gateway and one
# externally synchronized runtime Secret. Replace only the example host,
# issuer, Gateway reference, image repositories/tags, and Secret coordinates.
hop1:
  issuers:
    - name: platform-identity
      issuer: https://identity.example.com
      audiences:
        - https://mcp.example.com/mcp
      jwksUrl: https://identity.example.com/.well-known/jwks.json
      allowedAlgorithms:
        - EdDSA
      discoverable: true
      emailClaim: email
      subjectClaim: sub

agentgateway:
  enabled: true
  image:
    repository: registry.example.com/mcp/agentgateway
    tag: 0.7.0
    digest: ""
  nodeSelector:
    kubernetes.io/arch: amd64
  mcpAuthentication:
    mode: strict
    resourceMetadata:
      resource: https://mcp.example.com/mcp
      scopesSupported:
        - openid
        - email
      bearerMethodsSupported:
        - header
  backends:
    - name: db-mcp
      enabled: true
      serviceName: db-mcp
      port: 8080
      path: /mcp
  ingress:
    enabled: false
  gatewayApi:
    httpRoute:
      enabled: true
      hostname: mcp.example.com
      parentRefs:
        - name: shared-gateway
          namespace: gateway-system
          sectionName: https
      # Streaming MCP requests have no route-level deadline.
      timeouts:
        request: 0s

# Opt in after supplying the target-binding Secret and workload identity.
remoteShell:
  enabled: false
  image:
    repository: registry.example.com/mcp/remote-shell
    tag: ""
    digest: ""
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    # Or add the workload-role annotation above.
    podIdentity: false
  aws:
    region: us-east-1
  bindingsSecretRef:
    name: runtime-secrets
    key: remote-shell-bindings
  runBinding:
    tagKey: example:run-id
  networkPolicy:
    ingressPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway-system
  ingress:
    enabled: false
  gatewayApi:
    httpRoute:
      enabled: false
      hostname: mcp.example.com
      parentRefs:
        - name: shared-gateway
          namespace: gateway-system
          sectionName: https
      # Remote commands may exceed a shared Gateway's default timeout.
      timeouts:
        request: 0s

dbMcp:
  enabled: true
  image:
    repository: registry.example.com/mcp/db-mcp
    tag: 1.2.3
    digest: ""
  nodeSelector:
    kubernetes.io/arch: amd64
  secretRef:
    name: runtime-secrets
    envKeys: []
  databaseUrl:
    secretKey: database-url
