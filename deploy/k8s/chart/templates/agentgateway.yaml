{{- if .Values.agentgateway.enabled }}
{{- $introspectionIssuers := list }}
{{- range $index, $issuer := .Values.hop1.issuers }}
{{- with $issuer.introspection }}
{{- $introspectionIssuers = append $introspectionIssuers (dict "index" $index "config" .) }}
{{- end }}
{{- end }}
{{ include "mcp-gateway.serviceAccount" (dict "root" . "component" "agentgateway" "values" .Values.agentgateway) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway-config
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
data:
  config.yaml: |
    binds:
      - port: {{ .Values.agentgateway.port }}
        listeners:
          - routes:
              - matches:
                  - path:
                      exact: /mcp
                  - path:
                      exact: /.well-known/oauth-protected-resource/mcp
                policies:
                  cors:
                    allowOrigins: ["*"]
                    allowHeaders: [mcp-protocol-version, content-type, authorization]
                    exposeHeaders: ["Mcp-Session-Id"]
                  mcpAuthentication:
                    mode: {{ .Values.agentgateway.mcpAuthentication.mode }}
{{- if .Values.hop1.issuers }}
                    providers:
{{- range $index, $issuer := .Values.hop1.issuers }}
                      - issuer: {{ $issuer.issuer }}
                        audiences:
{{ toYaml $issuer.audiences | nindent 26 }}
                        allowedAlgorithms:
{{ toYaml $issuer.allowedAlgorithms | nindent 26 }}
                        jwks:
                          url: {{ $issuer.jwksUrl }}
                        discoverable: {{ $issuer.discoverable | default false }}
{{- with $issuer.clientId }}
                        clientId: {{ . }}
{{- end }}
{{- with $issuer.introspection }}
                        introspection:
                          url: {{ .url }}
                          credentialFile: /var/run/secrets/mcp-gateway/introspection/issuer-{{ $index }}
{{- end }}
{{- end }}
{{- else if .Values.agentgateway.mcpAuthentication.providers }}
                    providers:
{{ toYaml .Values.agentgateway.mcpAuthentication.providers | nindent 22 }}
{{- else }}
                    providers:
                      - issuer: {{ .Values.agentgateway.mcpAuthentication.issuer }}
                        audiences:
{{ toYaml .Values.agentgateway.mcpAuthentication.audiences | nindent 26 }}
                        jwks:
                          url: {{ .Values.agentgateway.mcpAuthentication.jwksUrl }}
                        discoverable: true
{{- end }}
                    resourceMetadata:
{{ toYaml .Values.agentgateway.mcpAuthentication.resourceMetadata | nindent 22 }}
                backends:
                  - mcp:
                      failureMode: failOpen
                      prefixMode: never
{{- $enabledBackends := list }}
{{- range .Values.agentgateway.backends }}
{{- if .enabled }}
{{- $enabledBackends = append $enabledBackends . }}
{{- end }}
{{- end }}
{{- if $enabledBackends }}
                      targets:
{{- range $enabledBackends }}
{{- $host := .host | default "" }}
{{- if not $host }}
{{- $host = printf "http://%s-%s:%v%s" (include "mcp-gateway.fullname" $) .serviceName (.port | default 8080) (.path | default "/mcp") }}
{{- end }}
                        - name: {{ .name }}
                          policies:
                            backendAuth:
                              passthrough: {}
                          mcp:
                            host: {{ $host }}
{{- end }}
{{- else }}
                      targets: []
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  {{- if not .Values.agentgateway.hpa.enabled }}
  replicas: {{ .Values.agentgateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "agentgateway") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.agentgateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "agentgateway") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcp-gateway.serviceAccountName" (dict "root" . "component" "agentgateway" "values" .Values.agentgateway) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agentgateway.podSecurityContext | nindent 8 }}
      {{- include "mcp-gateway.podScheduling" .Values.agentgateway | nindent 6 }}
      containers:
        - name: agentgateway
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.agentgateway.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.agentgateway.securityContext | nindent 12 }}
          args:
            - --file
            - /etc/agentgateway/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.agentgateway.port }}
          {{- include "mcp-gateway.probes" .Values.agentgateway | nindent 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway/config.yaml
              subPath: config.yaml
              readOnly: true
          {{- if $introspectionIssuers }}
            - name: hop1-introspection
              mountPath: /var/run/secrets/mcp-gateway/introspection
              readOnly: true
          {{- end }}
          {{- with .Values.agentgateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mcp-gateway.fullname" . }}-agentgateway-config
      {{- if $introspectionIssuers }}
        - name: hop1-introspection
          projected:
            defaultMode: 0400
            sources:
          {{- range $entry := $introspectionIssuers }}
              - secret:
                  name: {{ $entry.config.credentialSecretKeyRef.name }}
                  optional: true
                  items:
                    - key: {{ $entry.config.credentialSecretKeyRef.key }}
                      path: issuer-{{ $entry.index }}
          {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  type: {{ .Values.agentgateway.service.type }}
  selector:
    {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "agentgateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.agentgateway.port }}
      targetPort: http
---
{{- if .Values.agentgateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
  {{- with .Values.agentgateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.agentgateway.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.agentgateway.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.agentgateway.ingress.host }}
      http:
        paths:
{{- range .Values.agentgateway.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-gateway.fullname" $ }}-agentgateway
                port:
                  name: http
{{- end }}
{{- end }}
---
{{- if .Values.agentgateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mcp-gateway.fullname" . }}-agentgateway
  minReplicas: {{ .Values.agentgateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.agentgateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agentgateway.hpa.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- if .Values.agentgateway.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway
spec:
  minAvailable: {{ .Values.agentgateway.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "agentgateway") | nindent 6 }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-agentgateway
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "agentgateway") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.agentgateway.port }}
{{- end }}
