{{- if and .Values.githubMcp.enabled (eq .Values.githubMcp.topology "separate") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "github-mcp") }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "github-mcp") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "github-wrapper") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.githubMcp.port }}
{{- end }}
