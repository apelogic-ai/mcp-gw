{{- if and .Values.agentgateway.enabled .Values.agentgateway.gatewayApi.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "agentgateway") }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: agentgateway
spec:
  parentRefs:
    {{- toYaml .Values.agentgateway.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.agentgateway.gatewayApi.httpRoute.hostname | quote }}
  rules:
    - matches:
        {{- range .Values.agentgateway.ingress.paths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      {{- with .Values.agentgateway.gatewayApi.httpRoute.timeouts.request }}
      timeouts:
        request: {{ . }}
      {{- end }}
      backendRefs:
        - name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "agentgateway") }}
          port: {{ .Values.agentgateway.port }}
    {{- if .Values.agentgateway.gatewayApi.httpRoute.providerCallbacks.enabled }}
    {{- if .Values.googleWorkspace.enabled }}
    - matches:
        - path:
            type: Exact
            value: "/oauth/google/callback"
      {{- with .Values.agentgateway.gatewayApi.httpRoute.timeouts.request }}
      timeouts:
        request: {{ . }}
      {{- end }}
      backendRefs:
        - name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "google-workspace") }}
          port: {{ .Values.googleWorkspace.port }}
    {{- end }}
    {{- if .Values.githubWrapper.enabled }}
    - matches:
        - path:
            type: Exact
            value: "/oauth/github/callback"
      {{- with .Values.agentgateway.gatewayApi.httpRoute.timeouts.request }}
      timeouts:
        request: {{ . }}
      {{- end }}
      backendRefs:
        - name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "github-wrapper") }}
          port: {{ .Values.githubWrapper.port }}
    {{- end }}
    {{- end }}
{{- end }}
