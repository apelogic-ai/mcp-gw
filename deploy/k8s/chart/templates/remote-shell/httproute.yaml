{{- if and .Values.remoteShell.enabled .Values.remoteShell.gatewayApi.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "remote-shell") }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: remote-shell
spec:
  parentRefs:
    {{- toYaml .Values.remoteShell.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.remoteShell.gatewayApi.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shell
      backendRefs:
        - name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "remote-shell") }}
          port: {{ .Values.remoteShell.port }}
      {{- with .Values.remoteShell.gatewayApi.httpRoute.timeouts.request }}
      timeouts:
        request: {{ . }}
      {{- end }}
{{- end }}
