{{- if .Values.oauthMigrations.enabled }}
{{- if or (not .Values.oauthMigrations.secretKeyRef.name) (not .Values.oauthMigrations.secretKeyRef.key) }}
{{- fail "oauthMigrations.secretKeyRef.name and oauthMigrations.secretKeyRef.key are required when OAuth migrations are enabled" }}
{{- end }}
{{- if .Values.oauthMigrations.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp-gateway.serviceAccountName" (dict "root" . "component" "oauth-migrations" "values" .Values.oauthMigrations) }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-migrations
  annotations:
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: "before-hook-creation"
    {{- with .Values.oauthMigrations.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-oauth-migrations
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-migrations
  annotations:
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
spec:
  backoffLimit: {{ .Values.oauthMigrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.oauthMigrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "oauth-migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mcp-gateway.serviceAccountName" (dict "root" . "component" "oauth-migrations" "values" .Values.oauthMigrations) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.oauthMigrations.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.oauthMigrations.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - bun
            - run
            - shared/oauth/migrate.ts
          securityContext:
            {{- toYaml .Values.oauthMigrations.securityContext | nindent 12 }}
          env:
            - name: TOKEN_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauthMigrations.secretKeyRef.name }}
                  key: {{ .Values.oauthMigrations.secretKeyRef.key }}
            {{- include "mcp-gateway.postgresqlCaEnv" . | nindent 12 }}
          {{- if .Values.postgresql.caBundle.enabled }}
          volumeMounts:
            {{- include "mcp-gateway.postgresqlCaVolumeMount" . | nindent 12 }}
          {{- end }}
          {{- with .Values.oauthMigrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.postgresql.caBundle.enabled }}
      volumes:
        {{- include "mcp-gateway.postgresqlCaVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
