{{- if .Values.githubWrapper.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "github-wrapper") }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "github-wrapper") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "agentgateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.githubWrapper.port }}
    {{- if .Values.connectionLifecycle.enabled }}
    - from:
        {{- range .Values.connectionLifecycle.allowedCallers }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceSelector.matchLabels | nindent 14 }}
          {{- with .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml .matchLabels | nindent 14 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.githubWrapper.port }}
    {{- end }}
{{- end }}
