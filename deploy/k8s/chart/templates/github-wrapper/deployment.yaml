{{- if .Values.githubWrapper.enabled }}
{{- if and (not .Values.hop1.issuers) (not .Values.googleWorkspace.authorizationBroker.enabled) }}
{{- fail "hop1.issuers must contain at least one issuer when githubWrapper is enabled" }}
{{- end }}
{{- $githubMcpSidecar := and .Values.githubMcp.enabled (eq .Values.githubMcp.topology "sidecar") }}
{{- $githubMcpDefaultUrl := printf "http://%s:%v/mcp" (include "mcp-gateway.componentName" (dict "root" . "component" "github-mcp")) .Values.githubMcp.port }}
{{- if $githubMcpSidecar }}
{{- $githubMcpDefaultUrl = printf "http://127.0.0.1:%v/mcp" .Values.githubMcp.port }}
{{- end }}
{{- $githubMcpUpstreamUrl := default $githubMcpDefaultUrl (index .Values.githubWrapper.env "GITHUB_MCP_UPSTREAM_URL") }}
{{- $githubWrapperPodSecurityContext := deepCopy .Values.githubWrapper.podSecurityContext }}
{{- if and $githubMcpSidecar (not (hasKey $githubWrapperPodSecurityContext "fsGroup")) }}
{{- $_ := set $githubWrapperPodSecurityContext "fsGroup" 10001 }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "github-wrapper") }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-wrapper
spec:
  {{- if not .Values.githubWrapper.hpa.enabled }}
  replicas: {{ .Values.githubWrapper.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "github-wrapper") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.githubWrapper.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "github-wrapper") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcp-gateway.serviceAccountName" (dict "root" . "component" "github-wrapper" "values" .Values.githubWrapper) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $githubWrapperPodSecurityContext | nindent 8 }}
      {{- include "mcp-gateway.podScheduling" .Values.githubWrapper | nindent 6 }}
      {{- if $githubMcpSidecar }}
      initContainers:
        - name: github-mcp-probe-installer
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.githubWrapper.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/cp
            - /usr/local/bin/bun
            - /probe/bun
          securityContext:
            {{- toYaml .Values.githubWrapper.securityContext | nindent 12 }}
          volumeMounts:
            - name: github-mcp-probe-bin
              mountPath: /probe
      {{- end }}
      containers:
        - name: github-wrapper
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.githubWrapper.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.githubWrapper.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.githubWrapper.port }}
          {{- if and .Values.githubWrapper.secretRef.name (eq (len .Values.githubWrapper.secretRef.envKeys) 0) }}
          envFrom:
            - secretRef:
                name: {{ .Values.githubWrapper.secretRef.name }}
          {{- end }}
          env:
            {{- range .Values.githubWrapper.secretRef.envKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.githubWrapper.secretRef.name }}
                  key: {{ . }}
            {{- end }}
            {{- with .Values.githubWrapper.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.trustBundle.enabled }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ include "mcp-gateway.trustBundlePath" . | quote }}
            {{- end }}
            {{- if .Values.googleWorkspace.authorizationBroker.enabled }}
            - name: HOP1_ISSUERS_JSON
              value: {{ include "mcp-gateway.hop1IssuersWithAuthorizationBrokerJson" . | quote }}
            {{- else if .Values.hop1.issuers }}
            - name: HOP1_ISSUERS_JSON
              value: {{ include "mcp-gateway.hop1IssuersJson" .Values.hop1.issuers | quote }}
            {{- end }}
            {{- if .Values.hop1.issuers }}
            {{- range $index, $issuer := .Values.hop1.issuers }}
            {{- with $issuer.introspection }}
            - name: HOP1_INTROSPECTION_CREDENTIAL_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialSecretKeyRef.name }}
                  key: {{ .credentialSecretKeyRef.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: GITHUB_MCP_UPSTREAM_URL
              value: {{ $githubMcpUpstreamUrl | quote }}
            {{- range $name, $value := .Values.githubWrapper.env }}
            {{- if ne $name "GITHUB_MCP_UPSTREAM_URL" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.policy.opaUrl }}
            - name: OPA_POLICY_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.githubWrapper.oauth.redirectAfterAllowedOrigins }}
            - name: GITHUB_OAUTH_REDIRECT_AFTER_ALLOWED_ORIGINS
              value: {{ join "," .Values.githubWrapper.oauth.redirectAfterAllowedOrigins | quote }}
            {{- end }}
            {{- include "mcp-gateway.postgresqlCaEnv" . | nindent 12 }}
          {{- include "mcp-gateway.probes" .Values.githubWrapper | nindent 10 }}
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            {{- include "mcp-gateway.postgresqlCaVolumeMount" . | nindent 12 }}
            {{- include "mcp-gateway.trustBundleVolumeMount" . | nindent 12 }}
            {{- with .Values.githubWrapper.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.githubWrapper.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $githubMcpSidecar }}
        - name: github-mcp
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.githubMcp.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.githubMcp.securityContext | nindent 12 }}
          args:
            - http
            - --listen-host
            - 127.0.0.1
            - --port
            - {{ .Values.githubMcp.port | quote }}
            - --base-path
            - /mcp
            - --scope-challenge
          ports:
            - name: github-mcp-http
              containerPort: {{ .Values.githubMcp.port }}
          {{- include "mcp-gateway.githubMcpSidecarProbes" .Values.githubMcp | nindent 10 }}
          env:
            {{- range $name, $value := .Values.githubMcp.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.githubMcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: github-mcp-probe-bin
              mountPath: /opt/mcp-gateway-probe
              readOnly: true
            {{- with .Values.githubMcp.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.githubMcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: runtime-tmp
          emptyDir: {}
        {{- include "mcp-gateway.postgresqlCaVolume" . | nindent 8 }}
        {{- include "mcp-gateway.trustBundleVolume" . | nindent 8 }}
        {{- with .Values.githubWrapper.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $githubMcpSidecar }}
        - name: github-mcp-probe-bin
          emptyDir: {}
        {{- with .Values.githubMcp.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
{{- end }}
