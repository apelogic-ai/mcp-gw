{{- range .Values.wrappers }}
{{- if .enabled }}
{{- $component := printf "generic-wrapper-%s" .name }}
{{- $catalog := .catalog }}
{{- $catalogPreset := $catalog.preset | default "" }}
{{- $jiraPreset := has $catalogPreset (list "jira" "jira-read-only") }}
{{- $catalogPath := "/etc/mcp-gw/catalog.yaml" }}
{{- if $jiraPreset }}
{{- $catalogPath = "/app/servers/generic-wrapper/catalog/jira/decisions.yaml" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" $ "component" (printf "%s-config" $component)) }}
  labels:
    {{- include "mcp-gateway.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
data:
  descriptor.yaml: |
    schemaVersion: mcp-gateway.generic-wrapper/v1
    name: {{ .name | quote }}
    toolPrefix: {{ .toolPrefix | quote }}
    catalogPath: {{ $catalogPath }}
    {{- if eq $catalogPreset "jira-read-only" }}
    catalogFilter:
      actionClasses: [read]
    {{- end }}
    lifecycleRoutes: {{ .lifecycleRoutes }}
    upstream:
{{ omit .upstream "sidecar" | toYaml | nindent 6 }}
    credential:
{{ .credential | toYaml | nindent 6 }}
    serverInfo:
{{ .serverInfo | toYaml | nindent 6 }}
    {{- with .sessions }}
    sessions:
{{ . | toYaml | nindent 6 }}
    {{- end }}
    {{- with .policy }}
    policy:
      {{- with .opaUrl }}
      opaUrl: {{ . | quote }}
      {{- end }}
      {{- with .yaml }}
      yamlFile: /etc/mcp-gw/policy.yaml
      {{- end }}
    {{- end }}
    {{- with .audit }}
    audit:
{{ . | toYaml | nindent 6 }}
    {{- end }}
  {{- if not $jiraPreset }}
  catalog.yaml: |
    schemaVersion: mcp-gateway.generic-catalog/v1
    catalogId: {{ $catalog.catalogId | quote }}
    tools:
{{ $catalog.tools | toYaml | nindent 6 }}
  {{- end }}
  {{- with .policy }}
  {{- with .yaml }}
  policy.yaml: |
{{ . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- end }}
