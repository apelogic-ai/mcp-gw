{{- range .Values.wrappers }}
{{- if .enabled }}
{{- $component := printf "generic-wrapper-%s" .name }}
{{- $serviceAccount := .serviceAccount | default (dict) }}
{{- $createServiceAccount := true }}
{{- if hasKey $serviceAccount "create" }}
{{- $createServiceAccount = $serviceAccount.create }}
{{- end }}
{{- if $createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount.name | default (include "mcp-gateway.componentName" (dict "root" $ "component" $component)) }}
  labels:
    {{- include "mcp-gateway.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
