{{- if .Values.productionProfile.enabled }}
{{- if not .Values.agentgateway.enabled }}
{{- fail "productionProfile requires agentgateway.enabled=true" }}
{{- end }}
{{- if not .Values.googleWorkspace.enabled }}
{{- fail "productionProfile requires googleWorkspace.enabled=true" }}
{{- end }}
{{- if not .Values.githubWrapper.enabled }}
{{- fail "productionProfile requires githubWrapper.enabled=true" }}
{{- end }}
{{- if not .Values.githubMcp.enabled }}
{{- fail "productionProfile requires githubMcp.enabled=true" }}
{{- end }}
{{- if not .Values.oauthMigrations.enabled }}
{{- fail "productionProfile requires oauthMigrations.enabled=true" }}
{{- end }}
{{- $googleWorkspaceTargets := 0 }}
{{- $githubMcpTargets := 0 }}
{{- range .Values.agentgateway.backends }}
{{- if .enabled }}
{{- if eq .name "google-workspace" }}
{{- $googleWorkspaceTargets = add1 $googleWorkspaceTargets }}
{{- else if eq .name "github-mcp" }}
{{- $githubMcpTargets = add1 $githubMcpTargets }}
{{- end }}
{{- end }}
{{- end }}
{{- if ne $googleWorkspaceTargets 1 }}
{{- fail "productionProfile requires exactly one enabled agentgateway backend named google-workspace" }}
{{- end }}
{{- if ne $githubMcpTargets 1 }}
{{- fail "productionProfile requires exactly one enabled agentgateway backend named github-mcp" }}
{{- end }}
{{- end }}

{{- $ca := .Values.postgresql.caBundle }}
{{- $configMapAny := or $ca.configMapKeyRef.name $ca.configMapKeyRef.key }}
{{- $configMapComplete := and $ca.configMapKeyRef.name $ca.configMapKeyRef.key }}
{{- $secretAny := or $ca.secretKeyRef.name $ca.secretKeyRef.key }}
{{- $secretComplete := and $ca.secretKeyRef.name $ca.secretKeyRef.key }}
{{- $configMapOnly := and $configMapComplete (not $secretAny) }}
{{- $secretOnly := and $secretComplete (not $configMapAny) }}
{{- if $ca.enabled }}
{{- if not (or $configMapOnly $secretOnly) }}
{{- fail "postgresql.caBundle requires exactly one complete configMapKeyRef or secretKeyRef when enabled" }}
{{- end }}
{{- if not $ca.mountPath }}
{{- fail "postgresql.caBundle.mountPath is required when enabled" }}
{{- end }}
{{- else if or $configMapAny $secretAny }}
{{- fail "postgresql.caBundle.enabled must be true when a CA reference is configured" }}
{{- end }}

{{- $broker := .Values.googleWorkspace.authorizationBroker }}
{{- range $name, $_ := .Values.googleWorkspace.env }}
{{- if or (hasPrefix "MCP_BROKER_" $name) (hasPrefix "MCP_DCR_" $name) (eq $name "MCP_AUTHORIZATION_ISSUER") (eq $name "MCP_RESOURCE_URI") (eq $name "MCP_OAUTH_STATIC_CLIENTS_JSON") }}
{{- fail (printf "googleWorkspace.env.%s is reserved; configure googleWorkspace.authorizationBroker instead" $name) }}
{{- end }}
{{- end }}
{{- $brokerKeyRef := $broker.signingKeyring.secretKeyRef }}
{{- $brokerKeyRefAny := or $brokerKeyRef.name $brokerKeyRef.key }}
{{- $brokerDcr := $broker.dcr }}
{{- $brokerProxy := $brokerDcr.trustedProxy }}
{{- $brokerProxyAny := or $brokerProxy.header (gt (len $brokerProxy.addresses) 0) }}
{{- $brokerBoundsAny := or (gt (int $brokerDcr.clientTtlMs) 0) (gt (int $brokerDcr.maxClients) 0) (gt (int $brokerDcr.maxRateKeys) 0) (gt (int $brokerDcr.rateLimit) 0) (gt (int $brokerDcr.rateWindowMs) 0) }}
{{- if $broker.enabled }}
{{- if not .Values.googleWorkspace.enabled }}
{{- fail "googleWorkspace.authorizationBroker requires googleWorkspace.enabled=true" }}
{{- end }}
{{- if or (not .Values.agentgateway.enabled) (not .Values.agentgateway.ingress.enabled) }}
{{- fail "googleWorkspace.authorizationBroker requires agentgateway and its public ingress to be enabled" }}
{{- end }}
{{- if or (not $broker.issuer) (not $broker.resource) (not $broker.googleCallbackUri) (not $broker.activeSigningKid) (eq (len $broker.scopes) 0) }}
{{- fail "googleWorkspace.authorizationBroker requires issuer, resource, googleCallbackUri, activeSigningKid, and at least one scope" }}
{{- end }}
{{- $publicUrlPattern := "^https://[^/?#]+(?:/[^?#]*)?$" }}
{{- if not (regexMatch $publicUrlPattern $broker.issuer) }}
{{- fail "googleWorkspace.authorizationBroker.issuer must be a clean public HTTPS URL" }}
{{- end }}
{{- if not (regexMatch $publicUrlPattern $broker.resource) }}
{{- fail "googleWorkspace.authorizationBroker.resource must be a clean public HTTPS URL" }}
{{- end }}
{{- if not (regexMatch $publicUrlPattern $broker.googleCallbackUri) }}
{{- fail "googleWorkspace.authorizationBroker.googleCallbackUri must be a clean public HTTPS URL" }}
{{- end }}
{{- if ne (regexFind "^https://[^/]+" $broker.issuer) (regexFind "^https://[^/]+" $broker.googleCallbackUri) }}
{{- fail "googleWorkspace.authorizationBroker.googleCallbackUri must use the issuer origin" }}
{{- end }}
{{- if ne (regexFind "^https://[^/]+" $broker.issuer) (regexFind "^https://[^/]+" $broker.resource) }}
{{- fail "googleWorkspace.authorizationBroker.resource must use the issuer origin for chart-managed ingress" }}
{{- end }}
{{- $brokerOriginHost := (urlParse $broker.issuer).host }}
{{- if ne $brokerOriginHost .Values.agentgateway.ingress.host }}
{{- fail "googleWorkspace.authorizationBroker issuer/resource origin must match agentgateway.ingress.host" }}
{{- end }}
{{- if not (and $brokerKeyRef.name $brokerKeyRef.key) }}
{{- fail "googleWorkspace.authorizationBroker.signingKeyring.secretKeyRef requires both name and key" }}
{{- end }}
{{- if or (eq (len $broker.ingressControllerPeer.namespaceSelector.matchLabels) 0) (eq (len $broker.ingressControllerPeer.podSelector.matchLabels) 0) }}
{{- fail "googleWorkspace.authorizationBroker.ingressControllerPeer requires non-empty namespace and pod selector labels" }}
{{- end }}
{{- if and (not $brokerDcr.enabled) (eq (len $broker.staticClients) 0) }}
{{- fail "googleWorkspace.authorizationBroker requires constrained DCR or at least one static client" }}
{{- end }}
{{- if and (not $brokerDcr.enabled) (or $brokerDcr.allowLoopbackRedirects $brokerProxyAny $brokerBoundsAny) }}
{{- fail "googleWorkspace.authorizationBroker.dcr must be enabled when DCR policy is configured" }}
{{- end }}
{{- if ne (not (not $brokerProxy.header)) (gt (len $brokerProxy.addresses) 0) }}
{{- fail "googleWorkspace.authorizationBroker.dcr.trustedProxy requires both header and addresses" }}
{{- end }}
{{- range $client := $broker.staticClients }}
{{- range $redirect := $client.redirectUris }}
{{- $isHttpsRedirect := regexMatch "^https://[^/?#]+(?:/[^?#]*)?$" $redirect }}
{{- $isLoopbackRedirect := regexMatch "^http://(?:localhost|127(?:\\.[0-9]{1,3}){3}|\\[::1\\])(?::[0-9]{1,5})?(?:/[^?#]*)?$" $redirect }}
{{- if not (or $isHttpsRedirect (and $brokerDcr.allowLoopbackRedirects $isLoopbackRedirect)) }}
{{- fail "googleWorkspace.authorizationBroker static client redirects require HTTPS or an explicitly allowed loopback HTTP URI" }}
{{- end }}
{{- end }}
{{- end }}
{{- if ne $broker.resource .Values.agentgateway.mcpAuthentication.resourceMetadata.resource }}
{{- fail "googleWorkspace.authorizationBroker.resource must equal agentgateway.mcpAuthentication.resourceMetadata.resource" }}
{{- end }}
{{- if ne (toJson $broker.scopes) (toJson .Values.agentgateway.mcpAuthentication.resourceMetadata.scopesSupported) }}
{{- fail "googleWorkspace.authorizationBroker.scopes must equal agentgateway.mcpAuthentication.resourceMetadata.scopesSupported" }}
{{- end }}
{{- $googleWorkspaceTargets := 0 }}
{{- range .Values.agentgateway.backends }}
{{- if and .enabled (eq .name "google-workspace") }}{{- $googleWorkspaceTargets = add1 $googleWorkspaceTargets }}{{- end }}
{{- end }}
{{- if ne $googleWorkspaceTargets 1 }}
{{- fail "googleWorkspace.authorizationBroker requires exactly one enabled agentgateway backend named google-workspace" }}
{{- end }}
{{- range .Values.hop1.issuers }}
{{- if eq .issuer $broker.issuer }}
{{- fail "googleWorkspace.authorizationBroker.issuer must be distinct from configured hop1 issuers; broker trust is generated by the chart" }}
{{- end }}
{{- end }}
{{- else }}
{{- if or $broker.issuer $broker.resource $broker.googleCallbackUri $broker.activeSigningKid (ne (toJson $broker.scopes) "[\"mcp\"]") $brokerKeyRefAny (gt (len $broker.ingressControllerPeer.namespaceSelector.matchLabels) 0) (gt (len $broker.ingressControllerPeer.podSelector.matchLabels) 0) (gt (len $broker.staticClients) 0) $brokerDcr.enabled $brokerDcr.allowLoopbackRedirects $brokerProxyAny $brokerBoundsAny }}
{{- fail "googleWorkspace.authorizationBroker.enabled must be true when broker configuration is set" }}
{{- end }}
{{- end }}
