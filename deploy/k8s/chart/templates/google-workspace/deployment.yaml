{{- if .Values.googleWorkspace.enabled }}
{{- if not .Values.hop1.issuers }}
{{- fail "hop1.issuers must contain at least one issuer when googleWorkspace is enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-google-workspace
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: google-workspace
spec:
  {{- if not .Values.googleWorkspace.hpa.enabled }}
  replicas: {{ .Values.googleWorkspace.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "google-workspace") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.googleWorkspace.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "google-workspace") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcp-gateway.serviceAccountName" (dict "root" . "component" "google-workspace" "values" .Values.googleWorkspace) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.googleWorkspace.podSecurityContext | nindent 8 }}
      {{- include "mcp-gateway.podScheduling" .Values.googleWorkspace | nindent 6 }}
      containers:
        - name: google-workspace
          image: {{ include "mcp-gateway.image" (dict "root" . "image" .Values.googleWorkspace.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.googleWorkspace.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.googleWorkspace.port }}
          {{- with .Values.googleWorkspace.secretRef.name }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            {{- if .Values.hop1.issuers }}
            - name: HOP1_ISSUERS_JSON
              value: {{ include "mcp-gateway.hop1IssuersJson" .Values.hop1.issuers | quote }}
            {{- range $index, $issuer := .Values.hop1.issuers }}
            {{- with $issuer.introspection }}
            - name: HOP1_INTROSPECTION_CREDENTIAL_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ .credentialSecretKeyRef.name }}
                  key: {{ .credentialSecretKeyRef.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.googleWorkspace.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.googleWorkspace.policy.enabled }}
            - name: GOOGLE_WORKSPACE_POLICY_FILE
              value: {{ .Values.googleWorkspace.policy.mountPath | quote }}
            {{- end }}
            {{- include "mcp-gateway.postgresqlCaEnv" . | nindent 12 }}
          {{- include "mcp-gateway.probes" .Values.googleWorkspace | nindent 10 }}
          {{- if or .Values.googleWorkspace.policy.enabled .Values.postgresql.caBundle.enabled }}
          volumeMounts:
            {{- if .Values.googleWorkspace.policy.enabled }}
            - name: google-workspace-policy
              mountPath: {{ .Values.googleWorkspace.policy.mountPath | quote }}
              subPath: google-workspace-policy.yaml
              readOnly: true
            {{- end }}
            {{- include "mcp-gateway.postgresqlCaVolumeMount" . | nindent 12 }}
          {{- end }}
          {{- with .Values.googleWorkspace.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.googleWorkspace.policy.enabled .Values.postgresql.caBundle.enabled }}
      volumes:
        {{- if .Values.googleWorkspace.policy.enabled }}
        - name: google-workspace-policy
          configMap:
            name: {{ include "mcp-gateway.fullname" . }}-google-workspace-policy
        {{- end }}
        {{- include "mcp-gateway.postgresqlCaVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
