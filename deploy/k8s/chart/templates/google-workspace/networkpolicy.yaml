{{- if .Values.googleWorkspace.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-google-workspace
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "google-workspace") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agentgateway
        {{- if .Values.googleWorkspace.authorizationBroker.enabled }}
        {{- if .Values.githubWrapper.enabled }}
        - podSelector:
            matchLabels:
              {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "github-wrapper") | nindent 14 }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.googleWorkspace.port }}
    {{- if .Values.googleWorkspace.authorizationBroker.enabled }}
    {{- if .Values.googleWorkspace.authorizationBroker.ingressSourceCidrs }}
    - from:
        {{- range .Values.googleWorkspace.authorizationBroker.ingressSourceCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.googleWorkspace.port }}
    {{- else }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.googleWorkspace.authorizationBroker.ingressControllerPeer.namespaceSelector.matchLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.googleWorkspace.authorizationBroker.ingressControllerPeer.podSelector.matchLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.googleWorkspace.port }}
    {{- end }}
    {{- end }}
{{- end }}
