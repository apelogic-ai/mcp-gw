{{- if .Values.governedCli.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "governed-cli") }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: governed-cli
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "governed-cli") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.governedCli.networkPolicy.ingressPeers }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- with .podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.governedCli.port }}
{{- end }}
