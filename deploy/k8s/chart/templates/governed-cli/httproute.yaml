{{- if and .Values.governedCli.enabled .Values.governedCli.gatewayApi.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "governed-cli") }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: governed-cli
spec:
  parentRefs:
    {{- toYaml .Values.governedCli.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.governedCli.gatewayApi.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cli
      backendRefs:
        - name: {{ include "mcp-gateway.componentName" (dict "root" . "component" "governed-cli") }}
          port: {{ .Values.governedCli.port }}
{{- end }}
