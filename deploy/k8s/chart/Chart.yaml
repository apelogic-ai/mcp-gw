apiVersion: v2
name: mcp-gateway
description: Agent-agnostic MCP gateway with independently enabled provider adapters
type: application
icon: https://github.com/apelogic-ai.png
kubeVersion: ">=1.32.0-0"
version: 0.8.4
appVersion: "0.8.4"
maintainers:
  - name: HyperShell
    url: https://hypershell.ai
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: HyperShell
      url: https://hypershell.ai
  artifacthub.io/links: |
    - name: source
      url: https://github.com/apelogic-ai/mcp-gw
    - name: support
      url: https://github.com/apelogic-ai/mcp-gw/issues
  artifacthub.io/images: |
    - name: mcp-gw-agentgateway
      image: ghcr.io/apelogic-ai/mcp-gw-agentgateway:0.8.4
    - name: mcp-gw-google-workspace
      image: ghcr.io/apelogic-ai/mcp-gw-google-workspace:0.8.4
    - name: mcp-gw-github-wrapper
      image: ghcr.io/apelogic-ai/mcp-gw-github-wrapper:0.8.4
    - name: mcp-gw-generic-wrapper
      image: ghcr.io/apelogic-ai/mcp-gw-generic-wrapper:0.8.4
    - name: mcp-gw-governed-cli
      image: ghcr.io/apelogic-ai/mcp-gw-governed-cli:0.8.4
    - name: mcp-gw-remote-shell
      image: ghcr.io/apelogic-ai/mcp-gw-remote-shell:0.8.4
    - name: github-mcp-server
      image: ghcr.io/github/github-mcp-server:v1.6.0
  # Release images and the chart have signed GitHub build-provenance
  # attestations, verifiable via the GitHub Actions workflow identity. The
  # artifacthub.io/signKey annotation requires a PGP fingerprint and key URL,
  # so it does not describe this Sigstore-backed evidence and is omitted.
  artifacthub.io/changes: |
    - kind: added
      description: The Jira jira-read-write preset lets agents create, comment on, transition, update, and assign issues with each user's own Jira connection, through the same direct Jira Cloud REST v3 path as jira-read-only.
    - kind: added
      description: With providerCallbacks enabled, the shared AgentGateway HTTPRoute also publishes the exact OAuth callback of each enabled per-user OAuth wrapper.
    - kind: changed
      description: Jira HTTP 400, 404, 409, and 422 refusals return a sanitized provider_rejected tool error instead of an empty HTTP error.
