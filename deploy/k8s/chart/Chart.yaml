apiVersion: v2
name: mcp-gateway
description: Agent-agnostic MCP gateway with independently enabled provider adapters
type: application
version: 0.4.4
appVersion: "0.4.4"
maintainers:
  - name: Leonid Belyaev
    email: lbeliaev@gmail.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: Leonid Belyaev
      email: lbeliaev@gmail.com
  artifacthub.io/links: |
    - name: source
      url: https://github.com/apelogic-ai/mcp-gw
    - name: support
      url: https://github.com/apelogic-ai/mcp-gw/issues
  artifacthub.io/images: |
    - name: mcp-gw-agentgateway
      image: ghcr.io/apelogic-ai/mcp-gw-agentgateway:0.4.4
    - name: mcp-gw-google-workspace
      image: ghcr.io/apelogic-ai/mcp-gw-google-workspace:0.4.4
    - name: mcp-gw-github-wrapper
      image: ghcr.io/apelogic-ai/mcp-gw-github-wrapper:0.4.4
    - name: github-mcp-server
      image: ghcr.io/github/github-mcp-server:v1.6.0
  # Release images and the chart are signed with cosign keyless (Sigstore
  # OIDC) signatures pushed to the registry, verifiable via the GitHub Actions
  # workflow identity. Keyless signing uses short-lived Fulcio certificates and
  # has no static PGP fingerprint or key URL, so the artifacthub.io/signKey
  # annotation (which requires fingerprint + url for a PGP key) does not apply
  # and is intentionally omitted.
  artifacthub.io/changes: |
    - kind: fixed
      description: Accept refresh-token-capable public clients through constrained DCR while preserving authorization-code-only clients and RFC 7591 metadata defaults.
    - kind: security
      description: Rotate client refresh credentials, persist only their digests, bind them to client, principal, resource, and scope, and revoke the complete family on replay.
    - kind: fixed
      description: Keep dynamic registrations persistent by default and cap refresh lifetime when an operator configures an explicit client TTL.
