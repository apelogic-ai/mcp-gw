apiVersion: v2
name: mcp-gateway
description: Agent-agnostic MCP gateway with independently enabled provider adapters
type: application
icon: https://github.com/apelogic-ai.png
kubeVersion: ">=1.32.0-0"
version: 0.5.6
appVersion: "0.5.6"
maintainers:
  - name: HyperShell
    url: https://hypershell.ai
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: HyperShell
      url: https://hypershell.ai
  artifacthub.io/links: |
    - name: source
      url: https://github.com/apelogic-ai/mcp-gw
    - name: support
      url: https://github.com/apelogic-ai/mcp-gw/issues
  artifacthub.io/images: |
    - name: mcp-gw-agentgateway
      image: ghcr.io/apelogic-ai/mcp-gw-agentgateway:0.5.6
    - name: mcp-gw-google-workspace
      image: ghcr.io/apelogic-ai/mcp-gw-google-workspace:0.5.6
    - name: mcp-gw-github-wrapper
      image: ghcr.io/apelogic-ai/mcp-gw-github-wrapper:0.5.6
    - name: github-mcp-server
      image: ghcr.io/github/github-mcp-server:v1.6.0
  # Release images and the chart have signed GitHub build-provenance
  # attestations, verifiable via the GitHub Actions workflow identity. The
  # artifacthub.io/signKey annotation requires a PGP fingerprint and key URL,
  # so it does not describe this Sigstore-backed evidence and is omitted.
  artifacthub.io/changes: |
    - kind: fixed
      description: Align the Google Workspace CLI path across the image, chart, Compose, and runtime validation.
    - kind: fixed
      description: Recover remote JWKS after startup outages and refresh on unknown signing key IDs without restarting AgentGateway.
    - kind: changed
      description: Resolve apt dependencies from a dated Ubuntu snapshot and remove the unused Node.js runtime from wrapper images.
    - kind: security
      description: Bind attestations to the tagged release workflow and verify the upstream GitHub MCP Server signature before mirroring.
