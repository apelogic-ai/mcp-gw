apiVersion: v2
name: mcp-gateway
description: Agent-agnostic MCP gateway with independently enabled provider adapters
type: application
icon: https://github.com/apelogic-ai.png
kubeVersion: ">=1.32.0-0"
version: 0.5.2
appVersion: "0.5.2"
maintainers:
  - name: HyperShell
    url: https://hypershell.ai
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: HyperShell
      url: https://hypershell.ai
  artifacthub.io/links: |
    - name: source
      url: https://github.com/apelogic-ai/mcp-gw
    - name: support
      url: https://github.com/apelogic-ai/mcp-gw/issues
  artifacthub.io/images: |
    - name: mcp-gw-agentgateway
      image: ghcr.io/apelogic-ai/mcp-gw-agentgateway:0.5.2
    - name: mcp-gw-google-workspace
      image: ghcr.io/apelogic-ai/mcp-gw-google-workspace:0.5.2
    - name: mcp-gw-github-wrapper
      image: ghcr.io/apelogic-ai/mcp-gw-github-wrapper:0.5.2
    - name: github-mcp-server
      image: ghcr.io/github/github-mcp-server:v1.6.0
  # Release images and the chart have signed GitHub build-provenance
  # attestations, verifiable via the GitHub Actions workflow identity. The
  # artifacthub.io/signKey annotation requires a PGP fingerprint and key URL,
  # so it does not describe this Sigstore-backed evidence and is omitted.
  artifacthub.io/changes: |
    - kind: added
      description: Add complete build-from-source and artifact verification guidance plus a digest-preserving public mirror of the reviewed GitHub MCP Server image.
    - kind: changed
      description: Pin wrapper base images, apt packages, production dependencies, and the checksummed Google Workspace CLI build input.
    - kind: security
      description: Document GitHub Attestations for MCP-GW-built artifacts and digest equality for the third-party mirror without claiming false provenance.
