apiVersion: v2
name: mcp-gateway
description: Agent-agnostic MCP gateway with independently enabled provider adapters
type: application
version: 0.3.0
appVersion: "0.3.0"
maintainers:
  - name: Leonid Belyaev
    email: lbeliaev@gmail.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: Leonid Belyaev
      email: lbeliaev@gmail.com
  artifacthub.io/links: |
    - name: source
      url: https://github.com/apelogic-ai/mcp-gw
    - name: support
      url: https://github.com/apelogic-ai/mcp-gw/issues
  artifacthub.io/images: |
    - name: mcp-gw-agentgateway
      image: ghcr.io/apelogic-ai/mcp-gw-agentgateway:0.3.0
    - name: mcp-gw-google-workspace
      image: ghcr.io/apelogic-ai/mcp-gw-google-workspace:0.3.0
    - name: mcp-gw-github-wrapper
      image: ghcr.io/apelogic-ai/mcp-gw-github-wrapper:0.3.0
    - name: github-mcp-server
      image: ghcr.io/github/github-mcp-server:v1.6.0
  # Release images and the chart are signed with cosign keyless (Sigstore
  # OIDC) signatures pushed to the registry, verifiable via the GitHub Actions
  # workflow identity. Keyless signing uses short-lived Fulcio certificates and
  # has no static PGP fingerprint or key URL, so the artifacthub.io/signKey
  # annotation (which requires fingerprint + url for a PGP key) does not apply
  # and is intentionally omitted.
  artifacthub.io/changes: |
    - kind: added
      description: Add an optional standards-compatible MCP OAuth broker with PKCE, constrained DCR or static clients, exact-resource tokens, public metadata and JWKS, and typed Helm configuration.
    - kind: security
      description: Verify Google identity assertions before broker issuance, keep provider tokens private, project signing keyrings from an existing Secret, and fail closed on unsafe OAuth or deployment configuration.
    - kind: changed
      description: Preserve Google-broker and trusted-issuer identities as distinct principals and document reauthorization plus tested-client claim limits in the generated release handoff.
