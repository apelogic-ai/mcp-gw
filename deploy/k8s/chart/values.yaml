global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

productionProfile:
  enabled: false

hop1:
  issuers: []

oauthMigrations:
  enabled: false
  image:
    repository: ghcr.io/apelogic-ai/mcp-gw-google-workspace
    tag: ""
    digest: ""
  secretKeyRef:
    name: ""
    key: ""
  backoffLimit: 1
  activeDeadlineSeconds: 300
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}

agentgateway:
  enabled: false
  image:
    repository: ghcr.io/apelogic-ai/mcp-gw-agentgateway
    tag: ""
    digest: ""
  replicas: 1
  port: 8080
  mcpAuthentication:
    mode: strict
    resourceMetadata:
      resource: ""
      scopesSupported:
        - openid
        - email
      bearerMethodsSupported:
        - header
  backends:
    - name: google-workspace
      enabled: false
      serviceName: google-workspace
      port: 8080
      path: /mcp
    - name: db-mcp
      enabled: false
      serviceName: db-mcp
      port: 8080
      path: /mcp
    - name: github-mcp
      enabled: false
      serviceName: github-wrapper
      port: 8080
      path: /mcp
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  service:
    type: ClusterIP
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  probes:
    liveness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 2
      periodSeconds: 5
  ingress:
    enabled: false
    host: mcp.example.com
    className: ""
    annotations: {}
    paths:
      - /mcp
      - /.well-known/oauth-protected-resource/mcp
    tls: []
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1

googleWorkspace:
  enabled: false
  image:
    repository: ghcr.io/apelogic-ai/mcp-gw-google-workspace
    tag: ""
    digest: ""
  replicas: 1
  port: 8080
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  probes:
    liveness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 2
      periodSeconds: 5
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  policy:
    enabled: false
    mountPath: /etc/mcp-gw/google-workspace-policy.yaml
    yaml: ""
  env:
    PORT: "8080"
    GWS_BINARY_PATH: /app/node_modules/.bin/gws
    HOP1_OAUTH_SCOPES: openid email
    HOP1_EMAIL_CLAIM: email
    HOP1_SUBJECT_CLAIM: sub
  secretRef:
    name: ""

dbMcp:
  enabled: false
  image:
    repository: registry.example.com/mcp/db-mcp
    tag: ""
    digest: ""
  replicas: 1
  port: 8080
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  probes:
    liveness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 2
      periodSeconds: 5
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  env:
    MCP_TRANSPORT: http
    MCP_HOST: 0.0.0.0
    MCP_PORT: "8080"
    MCP_PATH: /mcp
    TOOL_MODE: shell
    TOOL_PROFILE: query
  secretRef:
    name: ""

githubWrapper:
  enabled: false
  image:
    repository: ghcr.io/apelogic-ai/mcp-gw-github-wrapper
    tag: ""
    digest: ""
  replicas: 1
  port: 8080
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  probes:
    liveness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      enabled: true
      tcpSocket:
        port: http
      initialDelaySeconds: 2
      periodSeconds: 5
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: false
    minAvailable: 1
  env:
    PORT: "8080"
